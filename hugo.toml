baseURL = 'https://example.org/'
locale = 'en-us'
title = "jaggedbyte's based blog"

theme = 'jaggedbyte'

[params]
  # "relatedtext" is the text that appears above the tag list at the bottom of pages.
relatedtext = "Related"
favicon = "/favicon.ico"

[caches]
  [caches.images]
    dir = ':cacheDir/images'

#list items
datesinlist = true
authorsinlist = true

#footer items
nextprev = true
taglist = true
showrss = true
